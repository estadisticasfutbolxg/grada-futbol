name: Publicar GRADA con ligas verificadas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar adaptadores y métricas
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Descargar ligas reales y generar SQLite
        run: python scripts/import_leagues.py --all
      - name: Comprobar JavaScript
        run: node --check dist/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
