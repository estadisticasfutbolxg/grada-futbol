name: Calidad y pruebas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt -r requirements-analysis.txt
      - run: npm run lint
      - run: ruff check scripts tests
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_collaboration_docs.py
